# Base de datos PostgreSQL (se puede cambiar con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prestamos}
spring.datasource.username=${DB_USER:prestamos}
spring.datasource.password=${DB_PASSWORD:prestamos}

# El esquema lo crea la propia aplicación (Configuracion) a partir de base_de_datos.sql
spring.sql.init.mode=never

# Cuentas y recursos de demostración si la base está vacía (poner false en un despliegue real)
prestamo.datos-demostracion=${DATOS_DEMO:true}

server.port=${PORT:8080}
server.error.include-message=never
